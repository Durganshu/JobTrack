[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "diy-job-tracker"
version = "0.1.0"
description = "A lightweight tool to monitor company career pages and detect new job listings."
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
job-tracker = "main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
